name: e2e-pr-gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `secrets` can't be read in a job-level `if`, so a tiny job checks them first. Only a fork
  # pull request may skip (GitHub withholds secrets from it); on any trusted run missing
  # credentials fail the workflow, so a green check always means the tests ran (OPS-002).
  secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          UNTRUSTED_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
          E2E_ENABLED: ${{ vars.E2E_ENABLED }}
        run: |
          # Opt-in: E2E needs a disposable Supabase project plus six repository secrets. Until the repository variable
          # E2E_ENABLED is 'true' the gate skips (visible warning, green run); once enabled, a missing secret fails closed.
          if [ "$E2E_ENABLED" != "true" ]; then
            echo "::warning::E2E skipped: set repository variable E2E_ENABLED=true and the six E2E secrets to run it"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY E2E_DATABASE_URL E2E_USER_EMAIL E2E_USER_PASSWORD; do
            if [ -z "${!name}" ]; then
              if [ "$UNTRUSTED_FORK" = "true" ]; then
                echo "::notice::E2E skipped: secrets are not available to fork pull requests"
                echo "ready=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::E2E credentials unavailable: repository secret $name is not set"
              exit 1
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

  e2e:
    needs: secrets
    if: needs.secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # CI has no primary environment: every secret is the disposable project.
      # The isolation check still requires the database and Supabase URL to be one project.
      E2E_PRIMARY_DATABASE_URL: ""
      E2E_PRIMARY_SUPABASE_URL: ""
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_ONBOARDING_PASSWORD: ${{ secrets.E2E_ONBOARDING_PASSWORD }}
      E2E_SCOPE: critical
      E2E_BROWSER_MATRIX: gate
      E2E_PERF_GATE: 1
      E2E_WORKERS: 1
      RATE_LIMIT_MODE: best-effort
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E critical gate (chromium)
        run: npm run test:e2e:critical

      - name: E2E perf gate
        run: npm run check:e2e:perf

      - name: Upload Playwright artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-pr
          path: |
            test-results
            playwright-report
