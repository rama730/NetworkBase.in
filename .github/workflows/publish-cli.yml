name: Publish @networkbase/cli

# Report A13.5 and §42.9: a cli-v* tag stages the release on npm through trusted publishing (no stored token).
# The trusted publisher may only stage; the owner approves each staged version on npmjs.com before it goes live.
on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node test/run.mjs
        working-directory: packages/nb-cli
        env:
          CI: 'true'

  publish:
    name: Stage on npm
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing and staged publishes need a recent npm 11. Pinned to the major: npm@latest moved to 12
      # mid-release (2026-11-10) and changed `npm pack --json`.
      - run: npm install -g npm@11

      - name: Tag must match package.json
        id: version
        working-directory: packages/nb-cli
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "cli-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;; *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;; esac

      - name: Size and startup budgets
        run: node packages/nb-cli/test/budgets.mjs --enforce

      # npm "auto-corrects" package.json when publishing, and dropped both bin entries for "./bin/nb.mjs" (next.2).
      # Fail instead if npm would change anything.
      - name: package.json needs no npm corrections
        working-directory: packages/nb-cli
        run: |
          npm pkg fix
          git diff --exit-code -- package.json || { echo "::error::npm would change package.json when publishing (diff above)"; exit 1; }

      # No --provenance: npm accepts provenance only from public repositories, and this one is private.
      - name: Stage the release
        working-directory: packages/nb-cli
        run: npm stage publish --access public --tag ${{ steps.version.outputs.tag }}

      - name: GitHub release with the changelog section
        working-directory: packages/nb-cli
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="## $VERSION" 'index($0, v) == 1 {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "CLI $VERSION" --notes-file notes.md $([ "${{ steps.version.outputs.tag }}" = next ] && echo --prerelease)

  # Report C7: nb as one program, for people without Node. Built and checked on every release; kept as run
  # artifacts. Published only when the public tap repository is set up (user steps): repository variable NB_TAP_REPO
  # (owner/homebrew-networkbase), and an environment "tap-release" with required reviewers holding the secret
  # NB_TAP_TOKEN (contents: write on that repository). Like npm, nothing goes out without the owner's approval, and
  # only once npm has this version live. Then the downloads go to the tap's release v<version>, with Formula/nb.rb
  # (brew install <owner>/networkbase/nb) and bucket/nb.json (Scoop).
  single-file:
    name: Single-file nb (${{ matrix.name }})
    needs: test
    strategy:
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and check
        working-directory: packages/nb-cli
        run: node scripts/single-file.mjs
      - name: Name it for the platform, with its checksum
        working-directory: packages/nb-cli/build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then f=nb-${{ matrix.name }}.exe; mv nb.exe "$f"; else f=nb-${{ matrix.name }}; mv nb "$f"; fi
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: nb-${{ matrix.name }}
          path: packages/nb-cli/build/nb-${{ matrix.name }}*

  installers:
    name: Downloads, Homebrew and Scoop
    needs: [publish, single-file]
    runs-on: ubuntu-latest
    environment: tap-release
    steps:
      - id: ready
        env:
          TAP_REPO: ${{ vars.NB_TAP_REPO }}
          TAP_TOKEN: ${{ secrets.NB_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_REPO" ] || [ -z "$TAP_TOKEN" ]; then
            echo "::warning::Single-file nb built (run artifacts) but not published: set variable NB_TAP_REPO and secret NB_TAP_TOKEN"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v4
      - name: npm has this version live (approved by the owner)
        if: steps.ready.outputs.ready == 'true'
        run: |
          version=$(node -p 'require("./packages/nb-cli/package.json").version')
          live=$(npm view "@networkbase/cli@$version" version 2>/dev/null || true)
          if [ "$live" != "$version" ]; then echo "::error::@networkbase/cli $version isn't live on npm yet: approve it there, then re-run this job"; exit 1; fi
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NB_TAP_REPO }}
          token: ${{ secrets.NB_TAP_TOKEN }}
          path: tap
      - name: Release the downloads and update the formula and manifest
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.NB_TAP_TOKEN }}
          TAP_REPO: ${{ vars.NB_TAP_REPO }}
        run: |
          version=$(node -p 'require("./packages/nb-cli/package.json").version')
          gh release create "v$version" --repo "$TAP_REPO" --title "nb $version" --notes "nb $version for macOS (Apple silicon), Linux (x64) and Windows (x64). Install: https://networkbase.in/docs/cli#install" dist/nb-* || gh release upload "v$version" --repo "$TAP_REPO" --clobber dist/nb-*
          cd tap
          node ../packages/nb-cli/scripts/packages.mjs "$version" "$TAP_REPO" ../dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/nb.rb bucket/nb.json
          git commit -m "nb $version" && git push
