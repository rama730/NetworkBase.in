name: onboarding-release-gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nb_s3
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role
      RATE_LIMIT_MODE: best-effort
    steps:
      - uses: actions/checkout@v4

      # Node 22 matches the Dockerfile; `tsx --test 'tests/unit/**'` needs Node's own glob (21+).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Dependency and architecture contracts
        run: |
          npm run check:deps:audit
          npm run check:deps:lockfile
          npm run check:page-contract
          npm run check:force-dynamic-allowlist
          npm run check:runtime-boundaries
          npm run check:api-versioning-contract
          npm run check:api-envelope-contract
          npm run check:query-key-contract
          npm run check:sql-governance

      - name: Security contracts
        run: |
          npm run check:csp-contract
          npm run check:trusted-proxy-contract
          npm run check:rls-contract
          npm run check:authz-contract

      # Throwaway Postgres from the runner's preinstalled binaries: Supabase shim,
      # schema push, then the chat migrations (same script as local runs).
      - name: Disposable database
        run: |
          set -o pipefail
          export PATH="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1):$PATH"
          url=$(scripts/chat-db/local-db.sh "$RUNNER_TEMP/pg" | tail -1) || { cat "$RUNNER_TEMP/pg/server.log"; exit 1; }
          echo "DATABASE_URL_FRESH=$url" >> "$GITHUB_ENV"

      - name: Chat database and action checks
        run: |
          npm run check:chat:db
          npm run check:chat:actions
