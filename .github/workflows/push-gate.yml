name: push-gate

# The checks a commit passes before it goes to main, run here instead of on the laptop (2026-11-27: running them locally,
# together, froze the machine). Push the commits to a gate/<anything> branch, wait for this run, then push the same
# commits to main. Database tests run on main in onboarding-release-gate.
on:
  push:
    branches:
      - "gate/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role
      RATE_LIMIT_MODE: best-effort
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Migration and SQL contracts
        run: |
          npm run check:db:migration-journal
          npm run check:rls-contract
          npm run check:sql-governance

  browser:
    # ubuntu-latest moved to 26.04, which this Playwright release doesn't support.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only the specs this branch touches: ones it edits, and ones whose fixture or spec imports a component it changes
      # (the whole suite, one worker, takes too long for a gate; main's nightly runs cover the rest).
      - name: Pick specs
        id: specs
        run: |
          changed=$(git diff --name-only origin/main...HEAD)
          picked=""
          for f in tests/browser/*.spec.ts; do
            fx="${f%.spec.ts}.fixture.tsx"
            if printf '%s\n' "$changed" | grep -qxF "$f" || printf '%s\n' "$changed" | grep -qxF "$fx"; then picked="$picked $f"; continue; fi
            for c in $(printf '%s\n' "$changed" | grep -E '^src/components/.*\.tsx$'); do
              n=$(basename "$c" .tsx)
              if grep -qsE "/$n['\"]" "$f" "$fx"; then picked="$picked $f"; break; fi
            done
          done
          # A spec missing from the config's testMatch would be skipped silently: fail instead.
          for f in $picked; do
            grep -q "\"$(basename "$f")\"" tests/browser/playwright.config.ts || { echo "::error::$(basename "$f") is not in tests/browser/playwright.config.ts testMatch"; exit 1; }
          done
          echo "list=$picked" >> "$GITHUB_OUTPUT"
          echo "Specs:$picked"
      - uses: actions/setup-node@v4
        if: steps.specs.outputs.list != ''
        with:
          node-version: 22
          cache: npm
      - if: steps.specs.outputs.list != ''
        run: npm ci
      - if: steps.specs.outputs.list != ''
        run: npx playwright install --with-deps chromium
      - name: Component browser specs
        if: steps.specs.outputs.list != ''
        env:
          SPECS: ${{ steps.specs.outputs.list }}
        run: npx playwright test -c tests/browser/playwright.config.ts --project=chromium --workers=2 $SPECS
