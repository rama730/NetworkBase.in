version: 2
updates:
  # open-pull-requests-limit: 0 turns off routine version bumps.
  # Security fixes still arrive when Dependabot security updates are enabled
  # (Settings -> Code security -> Dependabot security updates).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
